<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tetris - SERP Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Public Sans', Arial, sans-serif;
    }
    .game-wrapper {
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }
    h1 {
      color: #111827;
      margin-bottom: 1rem;
    }
    canvas {
      border: 2px solid #e5e7eb;
      background: #111827;
      border-radius: 0.375rem;
    }
    .info {
      color: #111827;
      font-size: 20px;
      margin: 10px 0;
      font-weight: 600;
    }
    .controls {
      color: #6b7280;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
  <link href="serpgames-branding.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="game-wrapper">
    <h1>Tetris</h1>
    <div class="info">Score: <span id="score">0</span> | Lines: <span id="lines">0</span></div>
    <canvas id="game" width="240" height="400"></canvas>
    <div class="controls">
      ← → Move | ↓ Drop | ↑ Rotate | Space Fast Drop
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const linesElement = document.getElementById('lines');

    const ROWS = 20;
    const COLS = 10;
    const BLOCK_SIZE = 20;

    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let lastTime = 0;

    const colors = [
      null,
      '#FF0D72',
      '#0DC2FF',
      '#0DFF72',
      '#F538FF',
      '#FF8E0D',
      '#FFE138',
      '#3877FF',
    ];

    const pieces = [
      [[0, 0, 0], [1, 1, 1], [0, 1, 0]], // T
      [[2, 2], [2, 2]], // O
      [[0, 3, 0], [0, 3, 0], [0, 3, 3]], // L
      [[0, 4, 0], [0, 4, 0], [4, 4, 0]], // J
      [[0, 5, 5], [5, 5, 0], [0, 0, 0]], // S
      [[6, 6, 0], [0, 6, 6], [0, 0, 0]], // Z
      [[0, 7, 0, 0], [0, 7, 0, 0], [0, 7, 0, 0], [0, 7, 0, 0]], // I
    ];

    const arena = createMatrix(COLS, ROWS);

    const player = {
      pos: { x: 0, y: 0 },
      matrix: null,
      score: 0,
    };

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      return pieces[type];
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(
              (x + offset.x) * BLOCK_SIZE,
              (y + offset.y) * BLOCK_SIZE,
              BLOCK_SIZE - 1,
              BLOCK_SIZE - 1
            );
          }
        });
      });
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }

      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerDropToBottom() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      playerDrop();
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0].charCodeAt(0) - 'I'.charCodeAt(0));
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        lines = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] &&
              arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        score += rowCount * 100;
        lines++;
        rowCount *= 2;
      }
    }

    function updateScore() {
      scoreElement.textContent = score;
      linesElement.textContent = lines;
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > 1000) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      } else if (event.keyCode === 32) {
        playerDropToBottom();
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
  <script src="serpgames-branding.js"></script>
</body>
</html>
